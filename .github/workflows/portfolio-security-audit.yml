name: Portfolio Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan current tree and Git history for credential material
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          patterns = [
              ('literal private/wallet key', re.compile(r'(?i)(?:private|wallet|secret|clean|compromised)[_ -]*(?:key|keypair|pk)[^\n]{0,100}?(?:0x)?[0-9a-f]{64}')),
              ('secret assignment', re.compile(r'(?i)(?:PRIVATE_KEY|WALLET_PRIVATE_KEY|SECRET_KEY|SOLANA_PRIVATE_KEY|JWT_SECRET|AUTH_SECRET|SUPABASE_SERVICE_ROLE_KEY|DISCORD_BOT_TOKEN)\s*[:=]\s*["\']?(?!your_|example|replace|change|process\.|os\.|env\.|<)[A-Za-z0-9+/=_-]{32,}')),
              ('Solana keypair array', re.compile(r'(?is)(?:secret|private|wallet)[_ -]*(?:key|keypair|pk)[^=\n]{0,60}[=:]\s*\[(?:\s*\d{1,3}\s*,){31,}\s*\d{1,3}\s*\]')),
              ('PEM private key', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('GitHub token', re.compile(r'\b(?:ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b')),
              ('OpenAI-style key', re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b')),
              ('Google API key', re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b')),
              ('AWS access key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('Telegram bot token', re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b')),
              ('Stripe live key', re.compile(r'\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b')),
              ('Slack token', re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b')),
              ('Alchemy keyed RPC URL', re.compile(r'https?://[^\s"\']*alchemy\.com/v2/[A-Za-z0-9_-]{16,}', re.I)),
              ('Infura keyed RPC URL', re.compile(r'https?://[^\s"\']*infura\.io/v3/[A-Za-z0-9_-]{16,}', re.I)),
          ]
          forbidden = re.compile(r'(^|/)(?:\.env(?:\..+)?|credentials\.json|service-account[^/]*\.json|[^/]+\.(?:pem|p12|pfx|key))$', re.I)
          templates = {'.env.example','env.example','.env.sample','env.sample'}

          current = []
          files = subprocess.check_output(['git','ls-files','-z']).decode(errors='ignore').split('\0')
          for file in filter(None, files):
              base = Path(file).name
              if forbidden.search(file.replace('\\','/')) and base not in templates:
                  current.append((file, 'credential-bearing filename'))
              try:
                  text = Path(file).read_text('utf-8', errors='ignore')
              except Exception:
                  continue
              if base in templates:
                  continue
              for label, pattern in patterns:
                  if pattern.search(text):
                      current.append((file, label))

          if current:
              print('Current-tree credential findings:')
              for file, label in sorted(set(current)):
                  print(f' - {file}: {label}')
              sys.exit(1)

          historical = []
          seen = set()
          for row in subprocess.check_output(['git','rev-list','--objects','--all'], text=True, errors='ignore').splitlines():
              parts = row.split(' ',1)
              oid = parts[0]
              path = parts[1] if len(parts) > 1 else '<unknown>'
              if oid in seen:
                  continue
              seen.add(oid)
              try:
                  if subprocess.check_output(['git','cat-file','-t',oid], text=True, stderr=subprocess.DEVNULL).strip() != 'blob':
                      continue
                  if int(subprocess.check_output(['git','cat-file','-s',oid], text=True, stderr=subprocess.DEVNULL).strip()) > 2_000_000:
                      continue
                  blob = subprocess.check_output(['git','cat-file','-p',oid], stderr=subprocess.DEVNULL).decode('utf-8', errors='ignore')
              except Exception:
                  continue
              if Path(path).name in templates:
                  continue
              for label, pattern in patterns:
                  if pattern.search(blob):
                      historical.append((path, label))
                      break

          if historical:
              print('::warning::Credential-like material exists in Git history. Rotate affected secrets before considering history cleanup.')
              for path, label in sorted(set(historical))[:100]:
                  print(f' history: {path}: {label}')
          else:
              print('Credential scan passed for current tree and scanned history.')
          PY

      - name: Audit Node production dependencies when present
        shell: bash
        run: |
          if [ -f package-lock.json ] && [ -f package.json ]; then
            npm ci --ignore-scripts
            npm audit --omit=dev --audit-level=high
          elif [ -f pnpm-lock.yaml ] && [ -f package.json ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm audit --prod --audit-level high
          elif [ -f package.json ]; then
            echo '::warning::package.json exists without a supported lockfile; dependency audit is not reproducible.'
          else
            echo 'No Node dependency manifest detected.'
          fi

      - name: Audit Python requirements when present
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -q pip-audit
            pip-audit -r requirements.txt
          else
            echo 'No root requirements.txt detected.'
          fi
